<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Max — Web3 developer · Python · Solidity">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: -apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .ring { transform-origin: 980px 160px; animation: spin 24s linear infinite; }
    .ring2 { transform-origin: 980px 160px; animation: spin 40s linear infinite reverse; }
    .dot { animation: pulse 1.6s ease-in-out infinite; transform-origin: 980px 160px; }
    .scan { animation: scan 4s ease-in-out infinite; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .l1 { clip-path: inset(0 100% 0 0); animation: typing 1.4s steps(46) .3s forwards; }
    .l2 { clip-path: inset(0 100% 0 0); animation: typing 1.4s steps(50) 1.9s forwards; }
    .l3 { clip-path: inset(0 100% 0 0); animation: typing .8s steps(14) 3.5s forwards; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { 0% { transform: translateY(-120px); opacity: 0; } 15% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateY(120px); opacity: 0; } }
    @keyframes typing { to { clip-path: inset(0 0 0 0); } }
  </style>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#f2a63d" stroke-opacity=".06"/>
    </pattern>
    <radialGradient id="glow" cx="980" cy="160" r="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2a63d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#f2a63d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" x2="1">
      <stop offset="0" stop-color="#6fe08c" stop-opacity="0"/>
      <stop offset=".5" stop-color="#6fe08c" stop-opacity=".7"/>
      <stop offset="1" stop-color="#6fe08c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scope"><circle cx="980" cy="160" r="118"/></clipPath>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#08090b"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1199" height="319" rx="18" fill="none" stroke="#f2a63d" stroke-opacity=".18"/>

  <!-- left: who -->
  <text x="64" y="76" class="mono" font-size="14" fill="#6fe08c">&gt; whoami</text>
  <text x="64" y="138" class="sans" font-size="58" font-weight="800" fill="#f3ede2">Max</text>
  <text x="64" y="178" class="sans" font-size="22" fill="#a49b8e">Web3 developer <tspan fill="#f2a63d">·</tspan> Python <tspan fill="#f2a63d">·</tspan> Solidity</text>

  <g class="mono" font-size="15">
    <text x="64" y="228" fill="#f3ede2" class="l1"><tspan fill="#6fe08c">$</tspan> building QuackTool — an NFT sniper for reveals</text>
    <text x="64" y="254" fill="#f3ede2" class="l2"><tspan fill="#6fe08c">$</tspan> scan · rank · snipe on Ethereum + Robinhood Chain</text>
    <text x="64" y="280" fill="#f3ede2" class="l3"><tspan fill="#6fe08c">$</tspan> open to work<tspan class="cursor" fill="#f2a63d"> █</tspan></text>
  </g>

  <!-- right: the scope -->
  <circle cx="980" cy="160" r="190" fill="url(#glow)"/>
  <g class="ring2">
    <circle cx="980" cy="160" r="138" fill="none" stroke="#f2a63d" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="2 10"/>
  </g>
  <g class="ring">
    <circle cx="980" cy="160" r="118" fill="none" stroke="#f2a63d" stroke-width="3" stroke-dasharray="40 14"/>
  </g>
  <circle cx="980" cy="160" r="74" fill="none" stroke="#f2a63d" stroke-width="10" stroke-opacity=".9"/>
  <circle cx="980" cy="160" r="34" fill="none" stroke="#f2a63d" stroke-width="8" stroke-opacity=".9"/>
  <g stroke="#f2a63d" stroke-width="12" stroke-linecap="round" stroke-opacity=".95">
    <line x1="980" y1="38" x2="980" y2="118"/><line x1="980" y1="202" x2="980" y2="282"/>
    <line x1="858" y1="160" x2="938" y2="160"/><line x1="1022" y1="160" x2="1102" y2="160"/>
  </g>
  <g clip-path="url(#scope)">
    <rect class="scan" x="862" y="158" width="236" height="3" fill="url(#beam)"/>
  </g>
  <circle class="dot" cx="980" cy="160" r="9" fill="#ff7a5c"/>
</svg>
